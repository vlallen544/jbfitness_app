name: jbfitness
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jbfitness
      POSTGRES_DB: jbfitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:db first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jbfitness -d jbfitness']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  database:
